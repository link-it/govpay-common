spring:
  application:
    name: govpay-client-commons

  datasource:
    # Configurazione per PostgreSQL
    url: jdbc:postgresql://localhost:5432/govpay
    username: govpay
    password: govpay
    driver-class-name: org.postgresql.Driver

    # Configurazione per MySQL
    #url: jdbc:mysql://localhost:3306/govpay
    #username: govpay
    #password: govpay
    #driver-class-name: com.mysql.cj.jdbc.Driver

    # Configurazione per Oracle
    #url: jdbc:oracle:thin:@localhost:1521:govpay
    #username: govpay
    #password: govpay
    #driver-class-name: oracle.jdbc.OracleDriver

    # Configurazione per SQL Server
    #url: jdbc:sqlserver://localhost:1433;databaseName=govpay
    #username: govpay
    #password: govpay
    #driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

    # Configurazione per HSQLDB (test)
    #url: jdbc:hsqldb:mem:govpay
    #username: sa
    #password:
    #driver-class-name: org.hsqldb.jdbc.JDBCDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Per MySQL: org.hibernate.dialect.MySQL8Dialect
        # Per Oracle: org.hibernate.dialect.Oracle12cDialect
        # Per SQL Server: org.hibernate.dialect.SQLServerDialect
        # Per HSQLDB: org.hibernate.dialect.HSQLDialect

govpay:
  client:
    cache:
      # Abilita/disabilita il caching delle configurazioni dei connettori e dei RestTemplate
      # Default: false (disabilitato)
      # Quando abilitato, migliora le performance ma richiede invalidazione manuale in caso di modifiche
      enabled: false

    async:
      # Configurazione thread pool per chiamate HTTP asincrone
      core-pool-size: 10       # Numero minimo thread sempre attivi
      max-pool-size: 50        # Numero massimo thread quando queue è piena
      queue-capacity: 100      # Numero task in attesa prima di creare nuovi thread
      thread-name-prefix: async-http-

logging:
  level:
    it.govpay.common.client: DEBUG
    org.springframework.web.client: DEBUG
